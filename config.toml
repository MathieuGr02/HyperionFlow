[[pipelines]]
name = "test"

###################
# source
###################
[pipelines.source]
name = "test"

[pipelines.source.consumer]
type = "kafka"
config = { host = "localhost", port = 9092, topic = "test_in", group = "test", partition = 1 }

[pipelines.source.writer]
type = "postgres"

[pipelines.source.writer.config]
host = "localhost"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"

[pipelines.source.writer.config.table]
name = "test_source"
columns = [
    { "name" = "id", "data_type" = "integer", nullable = false },
    { "name" = "value", "data_type" = "float", nullable = false }
]

[pipelines.source.deserializer]
type = "json"
config = { }

###################
# task
###################
[pipelines.task]
name = "test_task"

[pipelines.task.processor]
type = "postgres"

[pipelines.task.processor.config]
query = "INSERT INTO test_process (id, value) SELECT id, EXP(value) FROM test_source WHERE _ingestion_time >= $1 AND _ingestion_time <= $2"
host = "localhost"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"

[pipelines.task.processor.config.table]
name = "test_process"
columns = [
    { "name" = "id", "data_type" = "integer", nullable = false },
    { "name" = "value", "data_type" = "float", nullable = false },
]

[pipelines.task.trigger]
type = "count_trigger"
config = { max = 10 }

###################
# sink
###################
[pipelines.sink]
name = "test_sink"

[pipelines.sink.serializer]
type = "json"
config = { }

[pipelines.sink.reader]
type = "postgres"

[pipelines.sink.reader.config]
host = "localhost"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"
query = "SELECT id, value, _processing_time FROM test_process WHERE _processing_time > $1"

[pipelines.sink.producer]
type = "kafka"

[pipelines.sink.producer.config]
host = "localhost"
port = 9092
topic = "test_out"
group = "test"
partition = 1
