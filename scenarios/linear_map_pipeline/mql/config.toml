[[pipelines]]
name = "test"

# MongoDB configuration
[[pipelines.stores]]
name = "mongo"

[pipelines.stores.config]
type = "mongodb"
host = "mongodb"
port = 27017
username = "mongodb"
password = "mongodb"

###################
# source
###################
[pipelines.source]
name = "test"

[pipelines.source.consumer]
type = "kafka"

[pipelines.source.consumer.config]
host = "kafka"
port = 29092
topic = "test_in"
group = "test"
partition = 1

[pipelines.source.writer]
name = "mongo"

[pipelines.source.writer.config]
type = "mongodb"
database = "test"
collection = "test_in"

[pipelines.source.deserializer]
type = "json"
config = { }

###################
# task
###################
[pipelines.task]
name = "test_task"

[pipelines.task.processor]
name = "mongo"

[pipelines.task.processor.config]
type = "mongodb"
query = "{ \"$addFields\": { \"value\": { \"$exp\": \"$value\" } } }"
database = "test"
collection = "test_in"

[pipelines.task.trigger]
type = "count_trigger"
config = { max = 10 }

###################
# sink
###################
[pipelines.sink]
name = "test_sink"

[pipelines.sink.serializer]
type = "json"
config = { }

[pipelines.sink.reader]
name = "mongo"

[pipelines.sink.reader.config]
type = "mongodb"
database = "test"
collection = "test_out"

[pipelines.sink.producer]
type = "kafka"

[pipelines.sink.producer.config]
host = "kafka"
port = 29092
topic = "test_out"
group = "test"
partition = 1
