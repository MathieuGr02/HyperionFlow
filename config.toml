[[pipelines]]
name = "test"

[pipelines.source]
name = "test"

[pipelines.source.external]
type = "kafka"
host = "localhost"
port = 9092
topic = "test"
group = "test"
partition = 1

[pipelines.source.internal]
type = "postgres"

[pipelines.source.internal.config]
host = "localhost"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"

[pipelines.source.internal.table]
name = "test"
columns = [
    { "name" = "id", "data_type" = "Integer", nullable = false },
    { "name" = "name", "data_type" = "Text", nullable = false }
]

[pipelines.source.deserializer]
type = "json"


[pipelines.operator]
type = "postgres"
query = "SELECT name FROM test"

[pipelines.operator.config]
host = "localhost"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"
