[[pipelines]]
name = "test"

###################
# Source
###################
[pipelines.source]
name = "test"

[pipelines.source.consumer]
type = "kafka"
config = { host = "localhost", port = 9092, topic = "test_in", group = "test", partition = 1 }

[pipelines.source.writer]
type = "postgres"

[pipelines.source.writer.config]
host = "localhost"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"

[pipelines.source.writer.config.table]
name = "test_source"
columns = [
    { "name" = "id", "data_type" = "Integer", nullable = false },
    { "name" = "name", "data_type" = "Text", nullable = false }
]

[pipelines.source.deserializer]
type = "json"
config = { }

###################
# Task
###################
[pipelines.task]
name = "test_task"

[pipelines.task.operator]
type = "postgres"

[pipelines.task.operator.config]
query = "SELECT name FROM test_source"
host = "localhost"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"

[pipelines.task.operator.config.table]
name = "test_source"
columns = [
    { "name" = "id", "data_type" = "Integer", nullable = false },
    { "name" = "name", "data_type" = "Text", nullable = false }
]

[pipelines.task.trigger]
type = "count_trigger"
config = { max = 10 }

###################
# Sink
###################
[pipelines.sink]
name = "test_sink"

[pipelines.sink.serializer]
type = "json"
config = { }

[pipelines.sink.reader]
type = "postgres"
config = { host = "localhost", port = 5432, user = "postgres", dbname = "postgres", password = "postgres", query = "SELECT name FROM source_test_op" }

[pipelines.sink.producer]
type = "kafka"
config = { host = "localhost", port = 9092, topic = "test_out", group = "test", partition = 1 }
