[package]
name = "HyperionFlow"
version = "0.1.0"
edition = "2024"

[features]
default = []
all = ["sql"]
sql = ["dep:sqlx", "dep:postgres"]

[dependencies]
kafka = "0.10.0"

postgres = { version = "0.19.14", optional = true }
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres" ], optional = true }

# Error and logging
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
