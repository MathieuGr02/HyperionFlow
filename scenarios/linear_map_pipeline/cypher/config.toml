[[pipelines]]
name = "test"

###################
# source
###################
[pipelines.source]
name = "test"

[pipelines.source.consumer]
type = "kafka"

[pipelines.source.consumer.config]
host = "kafka"
port = 29092
topic = "test_in"
group = "test"
partition = 1

[pipelines.source.writer]
type = "neo4j"

[pipelines.source.writer.config]
host = "neo4j"
port = 7687
username = "neo4j"
password = "12345678"

[pipelines.source.deserializer]
type = "json"
config = { }

###################
# task
###################
[pipelines.task]
name = "test_task"

[pipelines.task.processor]
type = "neo4j"

[pipelines.task.processor.config]
host = "neo4j"
port = 7687
username = "neo4j"
password = "12345678"
query = "_"

[pipelines.task.trigger]
type = "count_trigger"
config = { max = 10 }

###################
# sink
###################
[pipelines.sink]
name = "test_sink"

[pipelines.sink.serializer]
type = "json"
config = { }

[pipelines.sink.reader]
type = "neo4j"

[pipelines.sink.reader.config]
host = "neo4j"
port = 7687
username = "neo4j"
password = "12345678"
query = "_"

[pipelines.sink.producer]
type = "kafka"

[pipelines.sink.producer.config]
host = "kafka"
port = 29092
topic = "test_out"
group = "test"
partition = 1
