[package]
name = "hyperion-manager"
version = "0.1.0"
edition = "2024"

[features]
# Store features
sql = ["dep:hyperion-sql"]
mql = ["dep:hyperion-mql"]
cypher = ["dep:hyperion-cypher"]

# Event features
kafka = ["dep:hyperion-kafka"]

all = ["sql", "mql", "cypher", "kafka"]

[dependencies]
hyperion-core = { path = "../hyperion-core" }

# Store adapters
hyperion-sql = { path = "../hyperion-sql", optional = true }
hyperion-mql = { path = "../hyperion-mql", optional = true }
hyperion-cypher = { path = "../hyperion-cypher", optional = true }

# Event adapters
hyperion-kafka = { path = "../hyperion-kafka", optional = true }

clap = { version = "4.6.7", features = ["derive"] }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[profile.release]
opt-level = 3
lto = true
