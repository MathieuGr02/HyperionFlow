[[pipelines]]
name = "test"

[pipelines.table]
name = "test_source"
columns = [
    { "name" = "id", "data_type" = "Integer", nullable = false },
    { "name" = "name", "data_type" = "Text", nullable = false }
]

###################
# Source
###################
[pipelines.source]
name = "test"

[pipelines.source.external]
type = "kafka"
config = { host = "localhost", port = 9092, topic = "test_in", group = "test", partition = 1 }

[pipelines.source.internal]
type = "postgres"
config = {host = "localhost", port = 5432, user = "postgres", dbname = "postgres", password = "postgres" }

[pipelines.source.deserializer]
type = "json"
config = { }

###################
# Task
###################
[pipelines.task]
name = "test_task"

[pipelines.task.operator]
type = "postgres"

[pipelines.task.operator.config]
query = "SELECT name FROM test_source"
config = { host = "localhost", port = 5432, user = "postgres", dbname = "postgres", password = "postgres" }

[pipelines.task.trigger]
type = "count_trigger"
config = { max = 10 }

###################
# Sink
###################
[pipelines.sink]
name = "test_sink"

[pipelines.sink.serializer]
type = "json"
config = { }

[pipelines.sink.internal]
type = "postgres"
config = {host = "localhost", port = 5432, user = "postgres", dbname = "postgres", password = "postgres" }

[pipelines.sink.external]
type = "kafka"
config = { host = "localhost", port = 9092, topic = "test_out", group = "test", partition = 1 }
