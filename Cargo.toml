[workspace]
members = ["hyperion-core", "hyperion-manager", "hyperion-sql", "hyperion-kafka"]
resolver = "3"

[workspace.dependencies]
# Error handling
thiserror = "2.0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

time = "0.3.55"

# Serialization / Deserialization
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.8"
serde_json = "1.0"

rstest = "0.28.0"
