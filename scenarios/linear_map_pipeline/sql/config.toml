[[pipelines]]
name = "test"

###################
# source
###################
[pipelines.source]
name = "test"

[pipelines.source.consumer]
type = "kafka"

[pipelines.source.consumer.config]
host = "kafka"
port = 29092
topic = "test_in"
group = "test"
partition = 1

[pipelines.source.writer]
type = "postgres"

[pipelines.source.writer.config]
host = "postgres"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"

[pipelines.source.writer.config.table]
name = "raw"
columns = [
    { "name" = "id", "data_type" = "integer", nullable = false },
    { "name" = "value", "data_type" = "float", nullable = false }
]

[pipelines.source.deserializer]
type = "json"

###################
# task
###################
[pipelines.task]
name = "test_task"

[pipelines.task.processor]
query = """
    FROM SQL(raw)
    PROJECT id, EXP(value) AS value
    COUNT_WINDOW(size=10)
    INTO SQL(processed)
    """

[pipelines.task.processor.config]
type = "postgres"
host = "postgres"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"

[pipelines.task.processor.config.table]
name = "processed"
columns = [
    { "name" = "id", "data_type" = "integer", nullable = false },
    { "name" = "value", "data_type" = "float", nullable = false },
]

[pipelines.task.trigger]
type = "count_trigger"
config = { max = 10 }

###################
# sink
###################
[pipelines.sink]
name = "test_sink"

[pipelines.sink.serializer]
type = "json"

[pipelines.sink.reader]
type = "postgres"

[pipelines.sink.reader.config]
host = "postgres"
port = 5432
user = "postgres"
dbname = "postgres"
password = "postgres"
query = "SELECT id, value, _processing_time FROM processed WHERE _processing_time > $1"

[pipelines.sink.producer]
type = "kafka"

[pipelines.sink.producer.config]
host = "kafka"
port = 29092
topic = "test_out"
group = "test"
partition = 1
