[package]
name = "hyperion-manager"
version = "0.1.0"
edition = "2024"

[features]
sql = ["dep:hyperion-sql"]
mql = ["dep:hyperion-mql"]
kafka = ["dep:hyperion-kafka"]
all = ["sql", "mql", "kafka"]

[dependencies]
hyperion-core = { path = "../hyperion-core" }

# Store adapters
hyperion-mql = { path = "../hyperion-mql", optional = true }
hyperion-sql = { path = "../hyperion-sql", optional = true }

hyperion-kafka = { path = "../hyperion-kafka", optional = true }

clap = { version = "4.6.7", features = ["derive"] }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
